    type: twitter
    enabled: true
    tier: 1
    handles:
      - karpathy
      - simonw
      - swyx
      - sama
      - gdb
      - aravsrinivas
      - hwchase17
      - logangkilpatrick
      - c_valenzuelab
      - itsPaulAi
      - op7418
      - dotey
      - steipete
      - emollick
      - deepseek_ai
      - kaifulee
      - Cursor
      - Replit
    per_handle_limit: 10
    time_window_hours: 36

  - id: twitter_tier2
    type: twitter
    enabled: false  # spot-check needed
    tier: 2
    handles:
      - saj_adib
      - chaseleantj
      - icreatelife
      - andrewallenxo
      - iwoszapar
    per_handle_limit: 10
    time_window_hours: 36

  # === Anthropic / Claude X handles ===
  # Routed to digest 「🟣 Anthropic / Claude 動態」 fixed section per CLAUDE.md
  # 「Anthropic / Claude 動態 鐵律」. Verified each handle via direct x.com
  # profile fetch on 2026-06-20. Split from twitter_tier1 so the digest agent
  # routes by source id instead of keyword-matching handle names.
  - id: twitter_anthropic
    type: twitter
    enabled: true
    tier: 1
    handles:
      - AnthropicAI       # 公司主帳號
      - claudeai          # 產品帳號（outage / UI 公告主管道）
      - ClaudeDevs        # Dev 公告 / quota reset 主管道（"Official updates for developers building with @ClaudeAI"）
      - DarioAmodei       # CEO（政策 / 重大公告）
      - jackclarkSF       # 共同創辦人 / Policy
      - ch402             # Chris Olah / Interpretability
      - AlexAlbert__      # DevRel 主管
      - bcherny           # Boris Cherny / Claude Code 創造者
      - trq212            # Thariq / Claude Code 工程師
      - AmandaAskell      # Claude personality / philosophy
    per_handle_limit: 10
    time_window_hours: 36

  # === Threads (Meta API) ===
  # ⚠️ Threads keyword/tag search returns ONLY the test user's own posts
  # while the Meta app is in Development mode. To search the full public
  # Threads firehose, the app must pass Meta App Review and go Live —
  # which is a heavy lift for personal use cases (privacy policy, ToS,
  # production deployment proof, justification of use case).
  # See BACKLOG.md "Threads keyword search dead-end" for path forward.
  - id: threads_keyword
    type: threads_apify
    # Disabled 2026-05-08: Apify actor D15iJFBNZ9wgeWAhw 持續 400 (payload schema)。
    # 8 天連續失敗，retry 救不回。待換 actor (memory: reference_threads_apify_scrapers
    # 提到 Apify Marketplace 有 10+ 替代 actor)。重啟前先 smoke test 確認新 actor 通。
    enabled: false
    tier: 1
    queries:
      - Claude
      - Cursor
      - MCP
      - coding agent
      - Codex
      - OpenAI
      - Anthropic
      - Gemini
      - AI startup
      - Sora
      - Veo
      - Suno
      - Midjourney
      - Runway
      - AI 工具
      - 生成式 AI
      - AI 應用
    per_query_limit: 2
    sort_by_recent: true

  - id: threads_topic_tag
    type: threads_apify
    enabled: false  # smoke run 2026-04-26 showed hashtag search returns mostly off-topic
    # spam (#AI hits cornstarch trends, viral reels, student-cheating tools).
    # threads_keyword above gives much higher signal density for the same cost.
    tier: 1
    queries:
      - "#AI"
      - "#GenerativeAI"
      - "#AITools"
    per_query_limit: 3
    sort_by_recent: true

  - id: threads_user_handles
    type: threads
    enabled: false  # skeleton
    tier: 2
    mode: user
    handles: []

  # === Chinese (Mainland) ===
  - id: zhihu_hot
    type: rsshub
    enabled: true
    tier: 1
    path: /zhihu/hot
    language: zh-CN

  # weibo / dcard via public RSSHub instances all return 503 (heavy
  # anti-scrape on target sites). Stays disabled until self-host RSSHub
  # (spec Appendix D).
  - id: weibo_search_ai
    type: rsshub
    enabled: false
    tier: 2
    path: /weibo/search/AI
    language: zh-CN

  # Direct RSS for major Chinese tech media — no RSSHub dependency.
  - id: 36kr_feed
    type: rss
    enabled: true
    tier: 2
    url: https://36kr.com/feed
    language: zh-CN

  - id: ifanr_feed
    type: rss
    enabled: true
    tier: 2
