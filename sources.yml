  # === V2EX (developer community, public API; no auth) ===
  # hot is general-purpose so keyword-filtered to AI/dev; create (分享創造)
  # is indie-maker showcases, kept unfiltered.
  - id: v2ex_hot
    type: v2ex
    enabled: true
    tier: 2
    node: hot
    limit: 20
    language: zh-CN
    keywords: [AI, LLM, agent, MCP, GPT, Claude, Cursor, 大模型, 模型, 编程, 开发, 独立开发, 创业, 部署, 开源]

  - id: v2ex_create
    type: v2ex
    enabled: true
    tier: 2
    node: create
    limit: 15
    language: zh-CN

  # jobs (酷工作) is mostly mainland on-site roles; keyword-filtered to
  # remote / AI-relevant postings to stay useful for a TW-based reader.
  - id: v2ex_jobs
    type: v2ex
    enabled: true
    tier: 2
    node: jobs
    limit: 20
    language: zh-CN
    keywords: [远程, 遠端, remote, AI, LLM, agent, 大模型, 算法, 机器学习]

  # === Chinese (Taiwan) ===
  - id: ithome_ai
    type: rss
    enabled: true
    tier: 2
    url: https://www.ithome.com.tw/rss/category/ai
    language: zh-TW

  # INSIDE 硬塞: previous /feed/ai endpoint returns 404. No discoverable
  # public RSS endpoint. Disabled for now — revisit via RSSHub or
  # Anthropic-style community feed if needed.
  - id: inside_ai
    type: rss
    enabled: false
    tier: 2
    url: https://www.inside.com.tw/feed/ai
    language: zh-TW

  # Same RSSHub instance limitations as weibo_search_ai. Disabled until
  # self-host. Threads in TW probably covers similar discussion better anyway.
  - id: dcard_engineer
    type: rsshub
    enabled: false
    tier: 2
    path: /dcard/posts/工程師
    language: zh-TW

  # BlockTempo is a crypto-focused TW outlet, but their AI category feed is
  # editor-curated AI-only content (OpenAI / Anthropic / Google AI / agent
  # business news in zh-TW). Bypasses spec's blanket "no crypto" rule because
  # the curated subset is on-spec.
  # 2026-06-03: BlockTempo moved AI from top-level /category/ai/ (now 404) to a
  # sub-category /category/business/ai/. Feed verified 200 + 10 AI-only items.
  - id: blocktempo_ai
    type: rss
    enabled: true
    tier: 2
    url: https://www.blocktempo.com/category/business/ai/feed/
    language: zh-TW
