defaults:
  language_default: en
  excerpt_max_chars: 200
  fetch_timeout_seconds: 30

sources:
  # === English: HN / Reddit / GitHub Trending / Product Hunt / HuggingFace ===
  - id: hn
    type: hn_algolia
    enabled: true
    tier: 1
    keywords: [LLM, AI, agent, MCP, coding agent, multimodal, Claude, GPT, Cursor]
    limit: 30

  - id: reddit_localllama
    type: reddit
    enabled: true
    tier: 1
    subreddit: LocalLLaMA
    time_window: day
    limit: 10

  - id: reddit_claudeai
    type: reddit
    enabled: true
    tier: 1
    subreddit: ClaudeAI
    time_window: day
    limit: 10

  - id: reddit_openai
    type: reddit
    enabled: true
    tier: 1
    subreddit: OpenAI
    time_window: day
    limit: 10

  - id: reddit_singularity
    type: reddit
    enabled: true
    tier: 2
    subreddit: singularity
    time_window: day
    limit: 10

  - id: reddit_machinelearning
    type: reddit
    enabled: true
    tier: 2
    subreddit: MachineLearning
    time_window: day
    limit: 10

  - id: github_trending
    type: github_trending
    enabled: true
    tier: 1
    languages: [python, typescript, rust, go, c, cpp, java, swift]
    since: [daily, weekly, monthly]
    # ai_keywords 保留 in config、但 fetcher 不再用來 drop（未來 Phase 4 fallback rule 用）
    ai_keywords: [ai, llm, agent, mcp, gpt, claude, multimodal, llama, diffusion, langchain]
    lo_keywords: [crypto, trading bot, wallet, game engine, blockchain]

  - id: trendshift
    type: trendshift
    enabled: true
    tier: 1
    limit: 25

  # === GitHub Search API (Phase 2.5、by description + name) ===
  # 補 github_trending 抓不到 stable 過峰值 AI repo 的漏
  # 實測 `q=skills+in:name+claude+in:description` 一發撈到
  # 5 個 100K+ 星系統性漏 repo（ECC / karpathy-skills / mattpocock/skills / caveman / graphify）
  - id: github_search
    type: github_search
    enabled: true
    tier: 1
    queries:
      - "stars:>10000 claude in:description pushed:>{7d}"
      - "stars:>5000 anthropic in:description pushed:>{7d}"
      - "stars:>1000 skills in:name claude in:description"
      - "stars:>1000 mcp in:name pushed:>{7d}"
      - "stars:>1000 agent in:description llm in:description pushed:>{7d}"
      - "stars:>1000 topic:claude-code pushed:>{7d}"
      - "stars:>1000 topic:llm topic:agent pushed:>{7d}"
    per_query_limit: 30

  - id: product_hunt
    type: product_hunt
    enabled: true
    tier: 2
    topic: artificial-intelligence
    limit: 10

  - id: huggingface_models
    type: huggingface
    enabled: true
    tier: 2
    category: models
    limit: 10

  - id: huggingface_spaces
    type: huggingface
    enabled: true
    tier: 2
    category: spaces
    limit: 10

  # === English Lab Blogs / Tech Media (RSS) ===
  # Anthropic doesn't ship an official RSS feed; using community-maintained
  # feed at https://github.com/Olshansk/rss-feeds (regenerated hourly).
  # If this stops working, swap to RSSHub /anthropic route or self-host.
  - id: anthropic_blog
    type: rss
    enabled: true
    tier: 1
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    language: en

  # Engineering blog (anthropic.com/engineering/*) is a separate section from
  # news. Added 2026-06-05 after follow-builders backstop surfaced anthropic_blog
  # (news-only feed) missing the Claude Code auto-mode engineering post on 5/23.
  - id: anthropic_engineering
    type: rss
    enabled: true
    tier: 1
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml
    language: en

  # claude.com/blog (product / Claude Code / enterprise posts) is a third section
  # separate from anthropic.com news + engineering. Added 2026-06-10 after
  # follow-builders backstop surfaced the second same-type miss: the
  # "Claude for Foundation Models" post (claude.com/blog) absent from raw md.
  # Same Olshansk mirror as the feeds above — if it stops working, swap or disable.
  - id: claude_blog
    type: rss
    enabled: true
    tier: 1
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_claude.xml
    language: en

  - id: openai_blog
    type: rss
    enabled: true
    tier: 1
    url: https://openai.com/blog/rss.xml
    language: en

  - id: google_ai_blog
    type: rss
    enabled: true
    tier: 2
    url: https://blog.google/technology/ai/rss/
    language: en

  # Mistral has no official RSS; using same community-maintained feed source
  # as anthropic_blog. Same caveat applies — if it stops working, swap or disable.
  - id: mistral_blog
    type: rss
    enabled: true
    tier: 2
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_mistral.xml
    language: en

  - id: techcrunch_ai
    type: rss
    enabled: true
    tier: 2
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    language: en

  - id: venturebeat_ai
    type: rss
    enabled: true
    tier: 2
    url: https://venturebeat.com/category/ai/feed/
    language: en

  # === English Security RSS ===
  # Added 2026-04-28 per feedback (security topic high priority — Cursor 刪庫,
  # supply-chain attacks, AI infra N-day all on radar). BleepingComputer +
  # SecurityWeek both 403'd RSS scrape so excluded; revisit via RSSHub if needed.
  - id: theregister_security
    type: rss
    enabled: true
    tier: 2
    url: https://www.theregister.com/security/headlines.atom
    language: en
    limit: 15

  - id: krebs_security
    type: rss
    enabled: true
    tier: 2
    url: https://krebsonsecurity.com/feed/
    language: en
    limit: 10

  - id: arstechnica_security
    type: rss
    enabled: true
    tier: 2
    url: https://arstechnica.com/security/feed/
    language: en
    limit: 15

  - id: thehackernews
    type: rss
    enabled: true
    tier: 2
    url: https://feeds.feedburner.com/TheHackersNews
    language: en
    limit: 15

  # === X / Twitter (twitterapi.io) ===
